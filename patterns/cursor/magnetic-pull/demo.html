<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>磁性吸附 Magnetic Pull — web-fx-lab</title>
<style>
:root{ --ink:#f4f4ed; --bg:#141416; --accent:#d2ff00;
       --dur-m:.6s; --ease-out:cubic-bezier(.19,1,.22,1); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink);
      font:16px/1.6 "Helvetica Neue",system-ui,sans-serif; }
main{ max-width:52rem; margin:0 auto; padding:4rem 1.5rem 6rem; }
h1{ font-size:clamp(1.6rem,4.5vw,2.4rem); letter-spacing:-.02em; margin:0 0 .5rem; }
p{ opacity:.75; max-width:38rem; }
code{ background:#2a2a2f; padding:.1em .35em; border-radius:3px; font-size:.9em; }

.row{ display:flex; flex-wrap:wrap; gap:2.5rem; align-items:center; margin:3rem 0; }

/* 感应区:透明的 padding 包裹层,比按钮大一圈。
   只在按钮自身监听的话,指针碰到边缘才开始吸,几乎看不出效果 */
.mag{ display:inline-block; padding:2rem; }

.btn{
  display:inline-grid; place-content:center; min-width:11rem; height:3.4rem;
  font:inherit; color:inherit; text-decoration:none; cursor:pointer;
  border:1px solid rgba(244,244,237,.28); background:transparent; border-radius:999px;
  transition:transform var(--dur-m) var(--ease-out),
             border-color .3s var(--ease-out), color .3s var(--ease-out);
}
/* 吸附期间关掉位移过渡才跟手;回弹时再开(靠移除这个 class) */
.btn.is-pulling{ transition:border-color .3s var(--ease-out), color .3s var(--ease-out); }
.btn:hover,.btn:focus-visible{ border-color:var(--accent); color:var(--accent); }
/* 键盘用户拿不到磁性,焦点态必须有等价反馈 */
.btn:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; }
.btn i{ font-style:normal; display:block;
        transition:transform var(--dur-m) var(--ease-out); }
.btn.is-pulling i{ transition:none; }

.solid{ background:var(--accent); color:#111112; border-color:var(--accent); }
.solid:hover,.solid:focus-visible{ color:#111112; }

.note{ margin-top:3rem; font-size:.85rem; opacity:.55; }
@media not all and (hover:hover){ .fine-only{ display:none; } }
</style>
</head>
<body>

<main>
  <h1>磁性吸附</h1>
  <p class="fine-only">把指针慢慢移向按钮——<strong>按钮会迎上来</strong>。热区一点没变,变的是心理感受:
     它在等你点。移开就弹回。</p>
  <p>里层文字用更小的强度再位移一次,幅度差制造"厚度"。</p>

  <div class="row">
    <span class="mag"><a class="btn solid js-mag" href="#"><i>开始项目</i></a></span>
    <span class="mag"><button class="btn js-mag"><i>看作品集</i></button></span>
  </div>

  <p>强度 <code>PULL</code> 建议 0.2–0.4。位移要夹上限,否则大按钮会被拉得离谱。
     全站按钮都会动 = 没有一个是特别的,<strong>留给主 CTA 和 logo</strong>。</p>

  <p class="note">触屏和 <code>prefers-reduced-motion</code> 下整个关掉——位移类微交互是前庭敏感的典型触发源。<br>
     配色排版是占位。进项目要跟项目的设计体系走(库规范铁律 6)。</p>
</main>

<script>
/* ===== KNOB ==========================================================
   PULL      吸附强度。.2 克制 / .35 明显 / >.5 会变成"按钮在逃跑"
   INNER     内层文字的强度,取 PULL 的一半左右做视差
   MAX_RATIO 位移上限 = 按钮高度 × 这个比例。不夹的话大按钮会拉飞
   ==================================================================== */
const PULL = 0.32, INNER = 0.16, MAX_RATIO = 0.34;

const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;

if (fine && !RM) {
  for (const zone of document.querySelectorAll('.mag')) {
    const btn = zone.querySelector('.js-mag');
    const inner = btn.querySelector('i');

    zone.addEventListener('pointermove', e => {
      const r = btn.getBoundingClientRect();
      const max = r.height * MAX_RATIO;
      const clamp = v => Math.max(-max, Math.min(max, v));
      const dx = clamp((e.clientX - (r.left + r.width / 2)) * PULL);
      const dy = clamp((e.clientY - (r.top + r.height / 2)) * PULL);
      btn.classList.add('is-pulling');                    // 吸附期间不要过渡,才跟手
      btn.style.transform = `translate(${dx}px, ${dy}px)`;
      if (inner) inner.style.transform =
        `translate(${dx * (INNER / PULL)}px, ${dy * (INNER / PULL)}px)`;
    });

    zone.addEventListener('pointerleave', () => {
      btn.classList.remove('is-pulling');                 // 放开过渡,transition 把它送回去
      btn.style.transform = '';
      if (inner) inner.style.transform = '';
    });
  }
}
</script>
</body>
</html>
