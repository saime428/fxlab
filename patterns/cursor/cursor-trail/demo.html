<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光标拖尾 Cursor Trail — fxlab</title>
<style>
:root{ --ink:#f4f4ed; --bg:#141416; --accent:#d2ff00; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink);
      font:16px/1.6 "Helvetica Neue",system-ui,sans-serif; overflow-x:hidden; }
main{ max-width:52rem; margin:0 auto; padding:4rem 1.5rem 7rem; }
h1{ font-size:clamp(1.6rem,4.5vw,2.4rem); letter-spacing:-.02em; margin:0 0 .5rem; }
p{ opacity:.75; max-width:38rem; }
code{ background:#2a2a2f; padding:.1em .35em; border-radius:3px; font-size:.9em; }

/* ============ 核心:N 个点,链式追赶 ============ */
.trail i{
  position:fixed; top:0; left:0; z-index:60;
  width:14px; height:14px; margin:-7px 0 0 -7px;
  border-radius:50%; background:var(--accent);
  pointer-events:none; opacity:0;
  transition:opacity .4s cubic-bezier(.19,1,.22,1);
}
.trail.on i{ opacity:1; }
body[data-blend="on"] .trail i{ mix-blend-mode:difference; background:#fff; }
/* ============================================== */

.switch{ position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); z-index:20;
  display:flex; gap:.25rem; padding:.3rem; border-radius:999px; background:rgba(20,20,20,.85); }
.switch button{ border:0; cursor:pointer; font:inherit; font-size:.72rem; letter-spacing:.1em;
  text-transform:uppercase; padding:.5rem .9rem; border-radius:999px; background:transparent; color:#f4f4ed; }
.switch button[aria-pressed="true"]{ background:var(--accent); color:#111; }
.switch button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.note{ margin-top:3rem; font-size:.85rem; opacity:.55; }
@media not all and (hover:hover){ .fine-only{ display:none; } .switch{ display:none; } }
/* 持续拖尾是前庭敏感的强触发源,比单点跟随严重,必须整个关掉 */
@media (prefers-reduced-motion:reduce){ .trail{ display:none; } .switch{ display:none; } }
</style>
</head>
<body data-blend="off">

<main>
  <h1>光标拖尾</h1>
  <p class="fine-only">甩一下鼠标。尾巴的形状不是画出来的,是<strong>链式滞后自然长出来的</strong>:
     第一个点追指针,第二个追第一个,第 n 个追第 n−1 个。不存历史轨迹,不做数组滑窗。</p>
  <p>它不传达任何信息,纯粹是"这个页面是活的"的信号。所以只适合体验型站、作品集、活动页——
     <strong>B 端页面上它是噪音</strong>,会和要读的东西抢注意力。</p>
  <p>切到 <code>difference</code> 看深浅背景通吃的版本(机制见 <code>cursor/blend-dot</code>)。</p>

  <p class="note">触屏和 <code>prefers-reduced-motion</code> 下整个关掉。<br>
     配色排版是占位。进项目要跟项目的设计体系走(库规范铁律 6)。</p>
</main>

<div class="switch" role="group" aria-label="混合开关">
  <button data-b="off" aria-pressed="true">纯色</button>
  <button data-b="on" aria-pressed="false">difference</button>
</div>

<div class="trail" id="trail" aria-hidden="true"></div>

<script>
/* ===== KNOB ==========================================================
   N     点数 = 尾巴长度。**4-6 是甜点区**。
         链式 lerp 是一串串联的一阶滤波器,每多一节延迟就叠一层:
         N=14 时最后几个点的收敛时间长到肉眼看就是"钉在原地不动",
         尾端于是永远挂在页面上某处 —— 不是 bug,是点数太多的必然结果。
         点少反而对:尾端跟着鼠标走,只是滞后一点,那才是"尾巴"
   LERP  链条松紧。.32 跟手 / .2 松散拖曳 / <.12 尾巴甩不回来
   ==================================================================== */
const N = 5, LERP = 0.32;

const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;

if (fine && !RM) {
  const wrap = document.getElementById('trail');
  const pts = [];
  for (let i = 0; i < N; i++) {
    const el = document.createElement('i');
    el.style.scale = (1 - i / N * 0.85).toFixed(3);   // 递减,初始化时算一次
    el.style.opacity = '';                            // 交给 .on 控制淡入
    el.style.filter = `opacity(${(1 - i / N * 0.75).toFixed(3)})`;
    wrap.append(el);
    pts.push({ x: 0, y: 0, el });
  }

  let mx = 0, my = 0, primed = false, running = true, raf = 0;

  addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    if (!primed) {
      primed = true;
      // 光标从哪进页面,尾巴就从哪开始。
      // 只改 p.x/p.y 不够 —— transform 要等下一个 rAF 才写,那一帧里元素还在
      // (0,0),淡入已经开始,于是能看到一串点从左上角甩过来。**必须同步写一次**。
      for (const p of pts) {
        p.x = mx; p.y = my;
        p.el.style.transform = `translate3d(${mx}px,${my}px,0)`;
      }
      wrap.classList.add('on');
    }
  }, { passive: true });

  const tick = () => {                                 // 单 rAF 管全部 N 个点
    let px = mx, py = my;
    for (const p of pts) {
      p.x += (px - p.x) * LERP; p.y += (py - p.y) * LERP;
      px = p.x; py = p.y;                              // 下一个追这一个
      p.el.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
    }
    if (running) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);

  document.addEventListener('visibilitychange', () => { // 后台不空转 N 个 transform
    running = !document.hidden;
    if (running) raf = requestAnimationFrame(tick); else cancelAnimationFrame(raf);
  });
}

const sw = document.querySelector('.switch');
sw.addEventListener('click', e => {
  const b = e.target.closest('button[data-b]'); if (!b) return;
  document.body.dataset.blend = b.dataset.b;
  for (const x of sw.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
});
</script>
</body>
</html>
