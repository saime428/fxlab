<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="fxlab:网页动效 pattern 画廊。一行一条,点开零依赖 demo。">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<title>fxlab — 网页效果画廊</title>
<style>
  /* 色板和列表照 claude.dev(2026-10)。字体用系统无衬线 + 等宽,不引用他们的字体文件。
     开场机制见 patterns/loading/typed-title-handoff */
  * { margin: 0; box-sizing: border-box; }
  :root {
    color-scheme: dark;
    --bg: #141413; --ink: #faf9f5; --ink-2: #b0aea5; --ink-3: #87867f; --ink-4: #5e5d59;
    --accent: #d97757; --line-soft: #faf9f517; --hover-row: #faf9f50b;
    --sans: "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
    --mono: "Cascadia Mono", "Sarasa Mono SC", ui-monospace, Consolas, monospace;
    --ease: cubic-bezier(.19, 1, .22, 1);
    --gutter: 2rem;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #faf9f5; --ink: #141413; --ink-2: #4c4b45; --ink-3: #7b7a72; --ink-4: #a8a69d;
      --accent: #c15f3c; --line-soft: #1414131c; --hover-row: #1414130d;
    }
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); }
  a { color: inherit; }
  .nav {
    position: sticky; top: 0; z-index: 6; display: flex; justify-content: flex-end;
    gap: 1.35rem; padding: 22px var(--gutter) 0; background: var(--bg);
  }
  .nav a {
    font-family: var(--mono); font-size: .75rem; letter-spacing: .04em;
    color: var(--ink-2); text-decoration: none;
  }
  .nav a.on, .nav a:hover, .nav a:focus-visible { color: var(--ink); }
  .nav a:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 4px; }
  .nav .k { color: var(--ink-3); margin-right: .35rem; }
  .wrap { padding: 0 var(--gutter) 12vh; }
  .below {
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 1.5rem; align-items: start; margin-top: 4rem;
  }
  .hero { grid-column: 1 / 5; position: sticky; top: 5.5rem; }
  .list-col { grid-column: 5 / 13; min-width: 0; }
  .wm {
    font-family: var(--mono); font-weight: 400; font-size: 1.75rem;
    line-height: 1.1; white-space: nowrap; letter-spacing: 0;
  }
  h1 { anchor-name: --wm; }
  .sub { color: var(--ink-2); margin-top: 1rem; padding-right: 1.5rem; line-height: 1.6; text-wrap: balance; }
  .sub a { color: var(--ink); }
  .list-top {
    display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem;
    border-bottom: 1px solid var(--line-soft); padding-bottom: 12px;
  }
  .tabs { display: flex; flex-wrap: wrap; gap: .45rem 0; align-items: baseline; min-width: 0; }
  .tab {
    background: none; border: 0; padding: 0; margin: 0 1.05rem 0 0; cursor: pointer;
    font-family: var(--mono); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
  }
  .tab[aria-pressed="true"], .tab:hover, .tab:focus-visible { color: var(--ink); }
  .tab:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 4px; }
  .search { font-family: var(--mono); font-size: .75rem; letter-spacing: .04em; display: flex; align-items: baseline; flex: none; }
  .s-toggle { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink-2); font: inherit; letter-spacing: inherit; white-space: nowrap; }
  .s-toggle .k { color: var(--ink-3); margin-right: .35rem; }
  .s-toggle:hover, .s-toggle:focus-visible, .search.open .s-toggle { color: var(--ink); }
  .s-toggle:focus-visible { outline: none; text-decoration: underline; text-underline-offset: 4px; }
  .search input {
    width: 0; opacity: 0; padding: 0; border: 0; outline: none; background: transparent;
    color: var(--ink); font-family: var(--sans); font-size: .875rem;
    transition: width .38s var(--ease), opacity .25s ease;
  }
  .search.open input { width: 180px; opacity: 1; margin-left: .8rem; }
  .search input::placeholder { color: var(--ink-4); }
  .post {
    display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); align-items: center;
    gap: 0 12px; padding: 16px 0; border-bottom: 1px solid var(--line-soft);
    text-decoration: none; color: inherit; animation: row-in .5s var(--ease) both;
    transition: opacity .25s;
  }
  /* 悬停一行时,其余行落到 .35。触屏没有 hover,第一次点只选中 */
  @media (hover: hover) {
    #list:hover .post:not(:hover):not(:focus-visible) { opacity: .35; }
  }
  #list:has(.post:focus-visible) .post:not(:focus-visible):not(:hover) { opacity: .35; }
  @media (hover: none) {
    #list:has(.post.tap) .post:not(.tap) { opacity: .35; }
  }
  .post:hover, .post:focus-visible { background: var(--hover-row); outline: none; }
  .post[hidden] { display: none; }
  .p-when { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; min-width: 0; }
  .p-body { grid-column: 3 / 8; min-width: 0; padding-right: 1rem; }
  .p-time { grid-column: 8 / 9; text-align: right; font-family: var(--mono); color: var(--ink-3); font-size: .875rem; }
  .p-cat { font-family: var(--mono); font-size: .75rem; letter-spacing: .04em; color: var(--ink-3); }
  .p-title { font-weight: 400; font-size: 18px; line-height: 1.5; text-wrap: balance; }
  .p-mech { display: none; }
  .tile { width: 32px; height: 32px; display: grid; place-items: center; flex: none; color: var(--ink-3); }
  .mark { width: 22px; height: 22px; display: block; fill: currentColor; }
  .feat { align-items: center; padding-top: 18px; padding-bottom: 18px; }
  .feat .tile { width: 96px; height: 96px; background: var(--accent); color: var(--bg); }
  .feat .mark { width: 56px; height: 56px; }
  .feat .p-title { font-weight: 500; font-size: clamp(1.5rem, 1.1rem + 1vw, 2rem); line-height: 1.25; }
  .feat .p-mech { display: block; color: var(--ink-2); margin-top: .45rem; line-height: 1.55; }
  .count, .empty, footer { font-family: var(--mono); font-size: .75rem; letter-spacing: .03em; color: var(--ink-3); }
  .count { margin-top: 1.25rem; }
  .empty { margin-top: 1.5rem; }
  footer { margin-top: 4rem; line-height: 1.9; }
  footer a { color: var(--ink-2); text-decoration: none; }
  footer a:hover, footer a:focus-visible { color: var(--ink); }
  .fallback { color: var(--ink-2); line-height: 1.7; padding: 2rem 0; }
  .fallback a { color: var(--ink); }
  #veil { position: fixed; inset: 0; z-index: 20; background: var(--bg); opacity: 0; pointer-events: none; }
  #ghost {
    position: fixed; z-index: 21; visibility: hidden; margin: 0;
    position-anchor: --wm; top: anchor(top); left: anchor(left); position-visibility: always;
  }
  html.no-anchor #ghost { top: 0; left: 0; }
  #preTxt { position: relative; display: inline-block; overflow-x: clip; }
  #preTxt:after { content: ""; position: absolute; inset: -.25em 0; background: var(--bg); }
  .caret { position: absolute; left: 0; top: .12em; width: .52em; height: .86em; background: var(--ink); opacity: 0; }
  html.intro:not(.intro-on) h1 { opacity: 0; }
  html.intro #veil { opacity: 1; pointer-events: auto; }
  html.intro-on h1 { animation: hold-out var(--pre-done) step-end; }
  html.intro-on #veil { animation: veil-out var(--veil-ms) ease var(--pre-done) both; }
  html.intro-on #ghost { animation: pre-hold var(--pre-gone) step-end; }
  html.intro-on #preTxt:after { animation: pre-cover var(--pre-typed) step-end forwards; }
  html.intro-on .caret {
    animation: pre-blink var(--pre-typed) step-end forwards, pre-caret var(--pre-typed) step-end forwards;
  }
  html.intro-lock { overflow: hidden; }
  html.reveal-hold * { animation-play-state: paused !important; }
  @keyframes hold-out { from, to { opacity: 0; } }
  @keyframes pre-hold { from, to { visibility: visible; } }
  @keyframes veil-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes row-in { from { opacity: 0; transform: translateY(12px); } }
  @keyframes pre-blink { 0%, 42% { opacity: 1; } 50%, 92% { opacity: 0; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #veil, #ghost { display: none !important; }
    h1, .post, .search input { animation: none !important; transition: none !important; transform: none !important; }
    h1, .search input { opacity: 1 !important; }
  }
  @media (max-width: 900px) {
    .below { display: block; margin-top: 2.5rem; }
    .hero { position: static; margin-bottom: 2.5rem; }
    .post { grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; }
    .p-when { grid-column: 1; grid-row: 1; align-self: center; }
    .p-body { grid-column: 2; grid-row: 1; }
    .p-time { grid-column: 3; grid-row: 1; text-align: right; align-self: center; }
    .feat .tile { width: 64px; height: 64px; }
    .feat .mark { width: 36px; height: 36px; }
    .search.open input { width: 120px; }
  }
</style>
<script>
/* 开场门:24h 内不再播。?intro=1 强制播,?intro=0 跳过。决定放在 head,避免先闪终态 */
(() => {
  const KEY = 'fxlab-typed-intro';
  const ONCE_H = 24;
  const q = new URLSearchParams(location.search).get('intro');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || q === '0') return;
  let recent = false;
  try { recent = Date.now() - (+localStorage.getItem(KEY) || 0) < ONCE_H * 36e5; }
  catch (e) { recent = false; }
  if (recent && q !== '1') return;
  document.documentElement.classList.add('intro');
  if (q !== '1') {
    try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
  }
  if (document.visibilityState === 'hidden') document.documentElement.classList.add('reveal-hold');
})();
</script>
</head>
<body>
  <div id="veil"></div>
  <div id="ghost" class="wm" aria-hidden="true"><span id="preTxt">fxlab</span><i class="caret"></i></div>
  <nav class="nav">
    <a class="on" href="./" aria-current="page"><span class="k">[H]</span>HOME</a>
    <a href="showcase/"><span class="k">[P]</span>SHOW</a>
    <a href="https://github.com/saime428/fxlab/blob/main/INDEX.md"><span class="k">[I]</span>INDEX</a>
    <a href="https://github.com/saime428/fxlab"><span class="k">[G]</span>GITHUB</a>
  </nav>
  <div class="wrap">
    <div class="below">
      <header class="hero">
        <h1 class="wm" id="wm">fxlab</h1>
        <p class="sub">获奖站的动效,收成一行一行的 pattern。点开就是零依赖 demo。整页参考在 <a href="showcase/">样板间</a>。</p>
      </header>
      <div class="list-col">
        <div class="list-top" id="filters" role="group" aria-label="筛选"></div>
        <div id="list"></div>
        <p class="empty" id="empty" hidden>没有匹配的 pattern</p>
        <p class="count" id="count"></p>
      </div>
    </div>
    <footer>
      <a href="https://github.com/saime428/fxlab/tree/main/cases">cases/</a> ·
      <a href="showcase/">showcase/</a> ·
      <a href="https://github.com/saime428/fxlab/blob/main/INDEX.md">INDEX.md</a> ·
      <a href="https://github.com/saime428/fxlab/blob/main/CONTRIBUTING.md">CONTRIBUTING.md</a> · MIT
    </footer>
  </div>
<script>
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const root = document.documentElement;
/* ===== 与 typed-title-handoff 同一组旋钮 =====
   TYPE_MS 1568 / HOLD_MS 240 / VEIL_MS 400。画廊 ONCE_H = 24,写在 head。 */
const TYPE_MS = 1568, HOLD_MS = 240, VEIL_MS = 400;
const WORD = document.getElementById('wm').textContent.trim();
(function installType() {
  const n = [...WORD].length;
  let cover = '0%{transform:translateX(0)}', caret = '0%{transform:translate(0,.12em)}';
  for (let i = 1; i <= n; i++) {
    const p = (i / n * 100).toFixed(2);
    cover += `${p}%{transform:translateX(${i}ch)}`;
    caret += `${p}%{transform:translate(${i}ch,.12em)}`;
  }
  const kf = document.createElement('style');
  kf.textContent = `@keyframes pre-cover{${cover}}@keyframes pre-caret{${caret}}`;
  document.head.appendChild(kf);
  root.style.setProperty('--pre-typed', TYPE_MS + 'ms');
  root.style.setProperty('--pre-done', (TYPE_MS + HOLD_MS) + 'ms');
  root.style.setProperty('--pre-gone', (TYPE_MS + HOLD_MS + VEIL_MS) + 'ms');
  root.style.setProperty('--veil-ms', VEIL_MS + 'ms');
})();
const anchorOK = !!(window.CSS && CSS.supports('anchor-name:--a'));
if (!anchorOK) root.classList.add('no-anchor');
const ghost = document.getElementById('ghost'), preTxt = document.getElementById('preTxt'), live = document.getElementById('wm');
function place() {
  if (anchorOK) return;
  const W = live.getBoundingClientRect(), T = preTxt.getBoundingClientRect(), P = ghost.getBoundingClientRect();
  ghost.style.left = (P.left + W.left - T.left) + 'px';
  ghost.style.top = (P.top + W.top - T.top) + 'px';
}
function armIntro() {
  if (REDUCED || !root.classList.contains('intro')) { window.__introEndsAt = 0; return; }
  if (document.visibilityState === 'hidden') {
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) requestAnimationFrame(armIntro);
    }, { once: true });
    return;
  }
  root.classList.remove('reveal-hold');
  scrollTo(0, 0);
  place();
  root.classList.add('intro-on', 'intro-lock');
  window.__introEndsAt = performance.now() + TYPE_MS + HOLD_MS;
  setTimeout(() => {
    document.getElementById('veil').style.pointerEvents = 'none';
    root.classList.remove('intro-lock');
  }, TYPE_MS + HOLD_MS);
}
armIntro();
addEventListener('resize', place);

const MARK = '<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="8" width="7" height="7"/><rect x="12" y="2" width="7" height="7"/><rect x="23" y="11" width="7" height="7"/><rect x="10" y="18" width="10" height="10"/></svg>';
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

(async () => {
  const list = document.getElementById('list'), count = document.getElementById('count'), empty = document.getElementById('empty');
  const fail = () => {
    list.innerHTML = '<div class="fallback">索引加载失败(本地 file:// 打开属预期)。<br><a href="https://github.com/saime428/fxlab#pattern-索引">去 GitHub 看列表 ↗</a></div>';
  };
  try {
    const md = await (await fetch('INDEX.md')).text();
    const lines = md.split('\n');
    const head = lines.findIndex(l => l.includes('| Pattern |'));
    if (head < 0) return fail();
    const cols = lines[head].split('|').map(s => s.trim());
    const col = name => cols.indexOf(name);
    const [cPat, cName, cLv, cMech] = [col('Pattern'), col('名称'), col('难度'), col('一句话机制')];
    const items = [];
    for (let i = head + 2; i < lines.length && lines[i].trim().startsWith('|'); i++) {
      const c = lines[i].split('|').map(s => s.trim());
      const link = /\[([^\]]+)\]\(([^)]+)\)/.exec(c[cPat] || '');
      if (!link) continue;
      items.push({ path: link[2], id: link[1].split('/')[1], name: c[cName], lv: c[cLv], mech: c[cMech], cat: link[1].split('/')[0] });
    }
    if (!items.length) return fail();
    const remain = () => Math.max(0, (window.__introEndsAt || 0) - performance.now());
    list.innerHTML = items.map((p, i) => {
      const delay = REDUCED ? '0ms' : (remain() + Math.min(i, 8) * 70) + 'ms';
      return `<a class="post" href="${esc(p.path)}demo.html" title="${esc(p.mech)}" style="animation-delay:${delay}"
         data-cat="${esc(p.cat)}" data-lv="${esc(p.lv)}" data-id="${esc(p.id)}"
         data-hay="${esc((p.name + ' ' + p.mech + ' ' + p.cat + ' ' + p.id).toLowerCase())}">
        <span class="p-when"><span class="tile">${MARK}</span><span class="p-cat">${esc(p.cat)}</span></span>
        <span class="p-body"><span class="p-title">${esc(p.name)}</span><span class="p-mech">${esc(p.mech)}</span></span>
        <span class="p-time">${esc(p.lv)}</span>
      </a>`;
    }).join('');

    const setHead = lines.findIndex(l => l.includes('| 场景 |'));
    const sets = [];
    for (let i = setHead + 2; setHead > 0 && i < lines.length && lines[i].trim().startsWith('|'); i++) {
      const c = lines[i].split('|').map(s => s.trim());
      sets.push({ label: (c[1] || '').split('/')[0].trim(), ids: (c[2] || '').split('+').map(s => s.trim()).filter(Boolean) });
    }
    const FEATURED = new Set(['scroll-driven-shader', 'image-displacement', 'particle-transition', 'shader-wipe', 'split-text-reveal', 'horizontal-gallery', 'view-transitions', 'drag-spring']);
    const cats = [...new Set(items.map(p => p.cat))];
    const state = { cat: '', level: '', set: '', featured: '', q: '' };
    const bar = document.getElementById('filters');
    const tab = (label, key, val) => `<button class="tab" type="button" data-key="${esc(key)}" data-val="${esc(val)}" aria-pressed="false">${esc(label)}</button>`;
    bar.innerHTML = `<div class="tabs">${tab('ALL', '', '')}${tab('镇馆 8', 'featured', '1')}${cats.map(c => tab(c, 'cat', c)).join('')}${['★', '★★', '★★★'].map((s, i) => tab(s, 'level', String(i + 1))).join('')}${sets.map((s, i) => tab(s.label, 'set', String(i + 1))).join('')}</div>
      <div class="search"><button class="s-toggle" type="button"><span class="k">[S]</span>SEARCH</button><input id="q" aria-label="搜索 pattern" placeholder="名称或机制"></div>`;

    function apply() {
      const posts = [...list.querySelectorAll('.post')];
      const setIds = state.set && sets[state.set - 1] ? sets[state.set - 1].ids : null;
      const q = state.q.toLowerCase();
      let shown = 0, first = null;
      posts.forEach(el => {
        const ok = (setIds ? setIds.includes(el.dataset.id)
          : (!state.cat || el.dataset.cat === state.cat) && (!state.level || el.dataset.lv.length === +state.level))
          && (!state.featured || FEATURED.has(el.dataset.id))
          && (!q || (el.dataset.hay || '').includes(q));
        el.hidden = !ok;
        el.classList.remove('feat');
        if (ok) { shown++; if (!first) first = el; }
      });
      if (first) first.classList.add('feat');
      posts.forEach(el => { if (el.hidden) el.classList.remove('tap'); });
      empty.hidden = shown !== 0;
      count.textContent = `${shown} / ${items.length}  ·  S 搜索,再点一次取消筛选`;
      bar.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed',
        b.dataset.key === '' ? String(!state.cat && !state.level && !state.set && !state.featured) : String(state[b.dataset.key] == b.dataset.val)));
      const params = new URLSearchParams(Object.entries(state).filter(([, v]) => v));
      const intro = new URLSearchParams(location.search).get('intro');
      if (intro) params.set('intro', intro);
      history.replaceState(null, '', params.size ? '?' + params : location.pathname);
    }
    list.addEventListener('click', e => {
      if (matchMedia('(hover: hover)').matches) return;
      const post = e.target.closest('.post');
      if (!post || post.hidden || post.classList.contains('tap')) return;
      e.preventDefault();
      list.querySelectorAll('.post.tap').forEach(el => el.classList.remove('tap'));
      post.classList.add('tap');
    });
    bar.addEventListener('click', e => {
      const s = e.target.closest('.s-toggle');
      if (s) { bar.querySelector('.search').classList.add('open'); bar.querySelector('#q').focus(); return; }
      const b = e.target.closest('.tab'); if (!b) return;
      const { key, val } = b.dataset;
      if (!key) Object.assign(state, { cat: '', level: '', set: '', featured: '' });
      else if (key === 'set') Object.assign(state, { cat: '', level: '', featured: '', set: state.set == val ? '' : val });
      else if (key === 'featured') Object.assign(state, { cat: '', level: '', set: '', featured: state.featured == val ? '' : val });
      else { state.set = ''; state.featured = ''; state[key] = state[key] == val ? '' : val; }
      apply();
    });
    bar.addEventListener('input', e => {
      if (e.target.id !== 'q') return;
      state.q = e.target.value.trim();
      apply();
    });
    addEventListener('keydown', e => {
      if (e.key !== 's' && e.key !== 'S') return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      bar.querySelector('.search').classList.add('open');
      bar.querySelector('#q').focus();
    });
    const params = new URLSearchParams(location.search);
    ['cat', 'level', 'set', 'featured', 'q'].forEach(k => state[k] = params.get(k) || '');
    if (state.q) { bar.querySelector('.search').classList.add('open'); bar.querySelector('#q').value = state.q; }
    apply();
  } catch (e) { fail(); }
})();
</script>
</body>
</html>
