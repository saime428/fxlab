<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="fxlab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c12"/>
      <stop offset="55%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#1a1428"/>
    </linearGradient>
    <radialGradient id="g1" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#8b7cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="78%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#47d8ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#47d8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#ff7c5c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7c5c" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 800 92px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ecebf2; }
      .em { fill: #8b7cf6; }
      .sub { font: 500 28px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9a9aaf; }
      .tag { font: 600 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #14101f; }
      .pill { fill: #8b7cf6; }
      .card { fill: #1b1b22; stroke: #2b2b35; stroke-width: 2; }
      .card-hi { stroke: #8b7cf6; }
      .mini { font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ecebf2; }
      .dim { font: 500 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #77778a; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#g1)"/>
  <rect width="1280" height="640" fill="url(#g2)"/>
  <rect width="1280" height="640" fill="url(#g3)"/>

  <text x="72" y="150" class="title">fx<tspan class="em">lab</tspan></text>
  <text x="72" y="210" class="sub">Copy-paste motion · live demos · AI skill</text>

  <g transform="translate(72 250)">
    <rect class="pill" rx="20" width="210" height="40"/>
    <text class="tag" x="24" y="26">zero-deps demos</text>
  </g>
  <g transform="translate(300 250)">
    <rect class="pill" rx="20" width="160" height="40" fill="#c5f542"/>
    <text class="tag" x="28" y="26">Featured 8</text>
  </g>
  <g transform="translate(478 250)">
    <rect class="pill" rx="20" width="200" height="40" fill="#47d8ff"/>
    <text class="tag" x="28" y="26">Claude skill</text>
  </g>

  <!-- faux preview cards -->
  <g transform="translate(72 340)">
    <rect class="card card-hi" width="280" height="180" rx="16"/>
    <rect x="16" y="16" width="248" height="100" rx="8" fill="#101014"/>
    <circle cx="80" cy="66" r="28" fill="#8b7cf6" opacity="0.7"/>
    <circle cx="140" cy="70" r="36" fill="#47d8ff" opacity="0.35"/>
    <text class="mini" x="16" y="145">scroll-driven-shader</text>
    <text class="dim" x="16" y="168">★★★ · scroll / webgl</text>
  </g>
  <g transform="translate(372 340)">
    <rect class="card" width="280" height="180" rx="16"/>
    <rect x="16" y="16" width="248" height="100" rx="8" fill="#101014"/>
    <rect x="40" y="36" width="90" height="60" rx="6" fill="#ff7c5c" opacity="0.55"/>
    <rect x="120" y="46" width="90" height="60" rx="6" fill="#8b7cf6" opacity="0.55"/>
    <text class="mini" x="16" y="145">image-displacement</text>
    <text class="dim" x="16" y="168">★★★ · transitions</text>
  </g>
  <g transform="translate(672 340)">
    <rect class="card" width="280" height="180" rx="16"/>
    <rect x="16" y="16" width="248" height="100" rx="8" fill="#101014"/>
    <circle cx="70" cy="70" r="4" fill="#c5f542"/><circle cx="100" cy="55" r="3" fill="#8b7cf6"/>
    <circle cx="130" cy="80" r="5" fill="#47d8ff"/><circle cx="160" cy="50" r="3" fill="#ff7c5c"/>
    <circle cx="190" cy="75" r="4" fill="#c5f542"/><circle cx="210" cy="60" r="3" fill="#8b7cf6"/>
    <text class="mini" x="16" y="145">particle-transition</text>
    <text class="dim" x="16" y="168">★★★ · GPU</text>
  </g>
  <g transform="translate(972 340)">
    <rect class="card" width="236" height="180" rx="16"/>
    <rect x="16" y="16" width="204" height="100" rx="8" fill="#101014"/>
    <text x="40" y="78" font-family="system-ui,sans-serif" font-size="36" font-weight="800" fill="#ecebf2">Aa</text>
    <text class="mini" x="16" y="145">split-text-reveal</text>
    <text class="dim" x="16" y="168">★ · landing default</text>
  </g>

  <text x="72" y="580" class="dim">saime428.github.io/fxlab · github.com/saime428/fxlab</text>
</svg>
